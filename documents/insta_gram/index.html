<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Insta Gram</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="header">
            <div class="logo">Insta Gram</div>
            <div class="header-icons">
                <i class="fa-solid fa-heart"></i>
                <i class="fa-solid fa-paper-plane"></i>
            </div>
        </header>

        <!-- Stories -->
        <div class="stories-container">
            <div class="story">
                <div class="story-ring">
                    <img src="https://via.placeholder.com/50" alt="User 1">
                </div>
                <span>User 1</span>
            </div>
            <div class="story">
                <div class="story-ring">
                    <img src="https://via.placeholder.com/50" alt="User 2">
                </div>
                <span>User 2</span>
            </div>
            <div class="story">
                <div class="story-ring">
                    <img src="https://via.placeholder.com/50" alt="User 3">
                </div>
                <span>User 3</span>
            </div>
        </div>

        <!-- Feed -->
        <div class="feed">
            <div class="post">
                <div class="post-header">
                    <img src="https://via.placeholder.com/30" alt="Avatar" class="avatar">
                    <span class="username">photographer_pro</span>
                </div>
                <div class="post-image">
                    <img src="https://via.placeholder.com/600x400" alt="Post Image">
                </div>
                <div class="post-actions">
                    <i class="fa-regular fa-heart like-btn"></i>
                    <i class="fa-regular fa-comment"></i>
                    <i class="fa-regular fa-paper-plane"></i>
                    <i class="fa-regular fa-bookmark save-btn"></i>
                </div>
                <div class="post-likes">1,234 likes</div>
                <div class="post-caption">
                    <span class="username">photographer_pro</span>
                    Capturing the moment! #instagood #photooftheday
                </div>
            </div>
        </div>

        <!-- Bottom Navigation -->
        <nav class="bottom-nav">
            <i class="fa-solid fa-house active"></i>
            <i class="fa-solid fa-magnifying-glass"></i>
            <i class="fa-regular fa-square-plus"></i>
            <i class="fa-solid fa-clapperboard"></i>
            <img src="https://via.placeholder.com/30" alt="Profile" class="nav-profile">
        </nav>
    </div>
    <script src="script.js"></script>
</body>
</html>
